<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пыль и порох</title>
<style>html,body{margin:0;background:#0d171c;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#f1dec1}canvas{width:100%;height:100%;display:block}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:18px}h1{font-size:38px;color:#edaa4a;letter-spacing:4px}progress{width:300px;accent-color:#edaa4a}#error{white-space:pre-wrap;max-width:620px}</style></head>
<body><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading"><h1>ПЫЛЬ И ПОРОХ</h1><div>Готовим салун к перестрелке…</div><progress id="progress" max="1" value="0"></progress><div id="error"></div></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
var canvas=document.getElementById('unity-canvas');
createUnityInstance(canvas,{
dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',
companyName:'DustAndPowder',productName:'DustAndPowder',productVersion:'0.1.0',
showBanner:function(msg,type){if(type==='error'){document.getElementById('loading').style.display='grid';document.getElementById('error').textContent=msg;}}
},function(p){document.getElementById('progress').value=p;}).then(function(instance){window.unityInstance=instance;document.getElementById('loading').style.display='none';canvas.focus();}).catch(function(e){document.getElementById('error').textContent=e.toString();});
</script></body></html>
